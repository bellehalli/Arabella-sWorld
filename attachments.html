<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6eef5"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>My Private Attachment Vault ♡ DreamHub</title><link rel="stylesheet" href="style.css"><style>
body{background:#f9f1f8;color:#422d42;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px}h1,h2{color:#7c4275}.vault-panel{background:white;border:1px solid #ead5e6;border-radius:20px;padding:22px;margin:20px 0}.vault-form{display:grid;gap:12px;max-width:640px}.vault-form label{display:grid;gap:6px}.vault-form input,.vault-form select,.vault-form button,.vault-row button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cfa9c7;max-width:100%}.vault-form button,.vault-row button{cursor:pointer;background:#f2d9eb}.vault-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #ead5e6}.vault-actions{display:flex;gap:8px;flex-wrap:wrap}.vault-meta{color:#715e70;font-size:.92rem}.vault-notice{min-height:1.5em}.vault-preview{max-width:min(90vw,900px);max-height:80vh}.vault-preview-image{max-width:min(85vw,900px);max-height:75vh;object-fit:contain}.vault-preview-text{max-width:80vw;max-height:70vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px;border:1px solid #ead5e6;border-radius:12px}.vault-dialog{max-width:95vw;border:1px solid #cfa9c7;border-radius:18px}.vault-dialog::backdrop{background:#201522b8}.vault-skip{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.vault-muted{color:#715e70}.vault-warning{border-left:4px solid #b86f00;padding:10px 14px;background:#fff8e9}.vault-empty{padding:18px;background:#faf5f9;border-radius:14px}@media(max-width:620px){.vault-row{grid-template-columns:1fr}.vault-actions button{flex:1}}
</style></head><body><main id="vault-root"><p>Opening your private vault…</p></main><dialog id="preview-dialog" class="vault-dialog" aria-labelledby="preview-title"><h2 id="preview-title">Private attachment preview</h2><div id="preview-content"></div><form method="dialog"><button class="softbutton">Close preview</button></form></dialog><script type="module" src="attachment-vault-page.mjs"></script></body></html>
